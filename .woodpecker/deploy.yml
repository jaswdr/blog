# Build and deploy on every push to master. PR validation is covered by
# GitHub Actions; this pipeline stays push-only so no fork PR can execute
# code with the host docker.sock mounted (pipeline config comes from the
# PR head). Built-in skip: [SKIP CI] / [CI SKIP] in the commit message.
when:
  - event: push
    branch: master

steps:
  # Tag by commit SHA; the deploy step is the only place :latest is moved
  # (the Woodpecker agent builds directly on the host daemon via docker.sock).
  - name: build
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t jaschweder/blog:${CI_COMMIT_SHA} .

  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker tag jaschweder/blog:${CI_COMMIT_SHA} jaschweder/blog:latest
      # Project name must stay "duckrent": keeps the duckrent-website-1
      # container name that Traefik routing and Grafana container alerts match.
      - docker compose --project-name duckrent up -d --no-deps website
    depends_on:
      - build
